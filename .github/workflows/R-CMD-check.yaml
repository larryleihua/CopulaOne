name: R package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.3'
          use-public-rspm: true
      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("hypergeo", "cubature"), repos="https://cloud.r-project.org")
          if (!requireNamespace("appell", quietly=TRUE)) install.packages("appell", repos="https://cloud.r-project.org")
          if (!requireNamespace("appell", quietly=TRUE)) install.packages("https://cran.r-project.org/src/contrib/Archive/appell/appell_0.0-4.tar.gz", repos=NULL, type="source")
          stopifnot(requireNamespace("appell", quietly=TRUE))
      - name: Check package
        run: Rscript scripts/check.R
